# Builds the release archives for a v* tag and publishes them with SHA256SUMS,
# install.sh and a build provenance attestation. A manual run (workflow_dispatch)
# is a dry run: it builds and attests, but doesn't release. See docs/releasing.md.
# install.sh accepts only attestations signed by this file, so keep its name.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # The tests run module code, so they get the read-only token and no OIDC token.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -count=1 ./...
  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the attestation
      attestations: write # store the attestation
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # history and tags, so go build stamps the version from git
          persist-credentials: false # nothing here pushes with git
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false # don't restore a cache into a release build
      - name: Build
        run: |
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}
            arch=${target#*/}
            name=threadsplice_${os}_${arch}
            exe=threadsplice
            if [ "$os" = windows ]; then exe=threadsplice.exe; fi
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags='-s -w' -o "dist/$name/$exe" ./cmd/threadsplice
            cp LICENSE README.md "dist/$name/"
            if [ "$os" = windows ]; then
              (cd "dist/$name" && zip -q "../$name.zip" "$exe" LICENSE README.md)
            else
              tar -czf "dist/$name.tar.gz" -C "dist/$name" "$exe" LICENSE README.md
            fi
          done
      - name: Check the version
        # Go stamps the tag as the version only when HEAD is exactly the tag and
        # the tree is clean. A manual run on a branch has no tag, so it just prints.
        run: |
          v=$(dist/threadsplice_linux_amd64/threadsplice version)
          echo "$v"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$v" != "threadsplice $GITHUB_REF_NAME" ]; then
            echo "::error::the binary reports '$v', not the tag $GITHUB_REF_NAME"
            exit 1
          fi
      - name: Checksums
        working-directory: dist
        run: |
          cp ../install.sh .
          sha256sum *.tar.gz *.zip install.sh | tee SHA256SUMS
      - uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case $GITHUB_REF_NAME in *-*) pre=--prerelease ;; *) pre= ;; esac # releases/latest skips v1.2.0-rc.1
          gh release create "$GITHUB_REF_NAME" ${pre:+"$pre"} --verify-tag --title "$GITHUB_REF_NAME" --generate-notes *.tar.gz *.zip SHA256SUMS install.sh
