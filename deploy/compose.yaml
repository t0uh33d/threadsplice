# Self-hosted relay: Caddy terminates TLS (automatic Let's Encrypt), the relay
# is reachable only through it, and the SQLite database lives in a volume.
#
#   cp deploy/.env.example deploy/.env   # set THREADSPLICE_DOMAIN and THREADSPLICE_ADMIN_TOKEN
#   docker compose -f deploy/compose.yaml up -d --build
services:
  relay:
    build: ..
    environment:
      THREADSPLICE_ADMIN_TOKEN: ${THREADSPLICE_ADMIN_TOKEN:?set THREADSPLICE_ADMIN_TOKEN in deploy/.env}
    volumes:
      - relay-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m
    # no ports: only Caddy can reach the relay

  caddy:
    image: caddy:2.11.7
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      THREADSPLICE_DOMAIN: ${THREADSPLICE_DOMAIN:?set THREADSPLICE_DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    mem_limit: 256m

volumes:
  relay-data:
  caddy-data:
  caddy-config:
